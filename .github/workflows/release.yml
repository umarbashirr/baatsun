name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build-deb.sh needs electron/node_modules (vite to build the window,
      # electron to ship it), and node_modules is not in git.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install the window's build dependencies
        working-directory: electron
        run: |
          npm ci
          # npm ci succeeds even when Electron's runtime download fails;
          # retry it explicitly so the .deb never ships without a window.
          [ -x node_modules/electron/dist/electron ] || node node_modules/electron/install.js

      - name: Check the Python sources compile
        run: python3 -m py_compile src/*.py

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}" packaging/build-deb.sh

      - name: Attach .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/*.deb
            packaging/dist/*.deb.sha256
          generate_release_notes: true
