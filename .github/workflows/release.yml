name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}" packaging/build-deb.sh

      - name: Attach .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*.deb
          generate_release_notes: true
