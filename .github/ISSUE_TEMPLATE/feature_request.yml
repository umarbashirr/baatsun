name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does it send anything off the machine?
      description: Offline is the default, and anything that sends data has to be opt-in. See CONTRIBUTING.md.
      options:
        - "No"
        - Yes, as an opt-in
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
